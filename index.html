    <!-- Inline script to prevent theme flash and support system preferences -->
    <script>
      (function() {
        const saved = localStorage.getItem('shayan-theme');
        let theme = 'dark';
        if (saved) {
          theme = saved;
        } else {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">
